services:
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: rag-hybrid-chroma
    ports:
      - '8100:8000'
    volumes:
      - ./chroma-data:/data
    environment:
      - IS_PERSISTENT=true
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    restart: unless-stopped
