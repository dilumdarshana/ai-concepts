allowBuilds:
  '@biomejs/biome': true
  '@modelcontextprotocol/inspector': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - uuid@14.0.1
  - '@langchain/openai@1.5.10'

packages:
  - 'langchain'
  - 'chromadb'
  - 'rag-json'
  - 'rag-huggingface'
  - 'langgraph'
  - 'mcp-client'
  - 'mcp-server-mongo'
  - 'mcp-server-mongo-v2'
  - 'rag-redis'
  - 'rag-graph'
  - 'rag-hybrid'
  - 'voltagent'
  - '*'
