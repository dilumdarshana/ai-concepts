[project]
name = "langchain-python"
version = "0.1.0"
description = "FastAPI tour of LangChain concepts — one route per concept, mirroring ts/langchain."
readme = "README.md"
authors = [
    { name = "dilumdarshana", email = "dilum.dar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
langchain-python = "langchain_python.run_uvicorn:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
